update_config:
  name: Обновить конфиг панели
  description: >
    Обновить полный конфиг конкретной BMS-панели. Если в конфиге есть
    ошибки валидации (несуществующие entity, конфликты) — сервис вернёт
    HomeAssistantError и не сохранит.
  fields:
    panel_id:
      name: Panel ID
      description: Код панели, заданный при add_panel.
      required: true
      selector: { text: {} }
    config:
      name: Конфиг
      description: Полный объект конфига (screens, home_nav, entities, и т.д.).
      required: true
      selector: { object: {} }

reset_config:
  name: Сбросить конфиг
  description: Вернуть конфиг панели к дефолту (все экраны включены, привязок нет).
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector: { text: {} }

add_panel:
  name: Добавить новую панель
  description: >
    Создать новую BMS-панель в системе. После добавления в сайдбаре
    появится она же и автоматически создастся sensor.bms_panel_<id>.
    Перед вызовом убедитесь что интеграция настроена через
    Settings → Devices & Services (иначе сервис вернёт понятную ошибку).
  fields:
    panel_name:
      name: Имя панели
      description: >
        Читаемое название, например «Панель кухни». Также принимается
        ключ name как alias — для совместимости с другими HA-сервисами.
      required: true
      example: Панель кухни
      selector: { text: {} }
    panel_id:
      name: Panel ID (опционально)
      description: >
        Латиница, цифры, _ и - (2–32 символа). Если не задан — сгенерируется
        из имени. Этот же код вводят на самой панели в Settings → Panel ID.
      required: false
      example: kitchen
      selector: { text: {} }

remove_panel:
  name: Удалить панель
  description: Удалить BMS-панель из системы вместе с её конфигом и sensor.
  fields:
    panel_id:
      name: Panel ID
      required: true
      selector: { text: {} }

clone_panel:
  name: Скопировать панель
  description: >
    Создать новую панель с теми же экранами и настройками что у источника.
    Привязки устройств НЕ копируются (одна лампа не может быть в двух
    панелях). Удобно для одинаково настроенных комнат.
  fields:
    source_panel_id:
      name: Откуда копировать (Panel ID)
      required: true
      selector: { text: {} }
    panel_name:
      name: Имя новой панели
      required: true
      example: Панель спальни 2
      selector: { text: {} }
    panel_id:
      name: Panel ID новой панели (опционально)
      required: false
      selector: { text: {} }

discover_factory_panels:
  name: Найти заводские панели в сети
  description: >
    Сканирует локальную сеть на заводские Linux-панели (SigmaStar SSD20x /
    FlyThings), ещё не подключённые к дому. Ничего не меняет на найденных
    устройствах — только показывает список IP для install_panel. Работает
    только для этой конкретной партии железа — если панель другой прошивки,
    в списке не появится.

install_panel:
  name: Установить приложение на панель
  description: >
    Заливает приложение на заводскую панель по её IP (взять из
    discover_factory_panels), выпускает ей собственный ключ дома и
    перезагружает — панель встаёт с уже готовым конфигом, без QR и без
    похода к ней с телефоном. Прошивка занимает до пары минут; НЕ
    выключайте панель и роутер до уведомления об окончании. Требует
    действующей лицензии дома — как обычная привязка по QR.
  fields:
    ip:
      name: IP панели
      description: Адрес из списка discover_factory_panels.
      required: true
      example: 192.168.1.150
      selector: { text: {} }
    panel_id:
      name: Panel ID существующей панели (опционально)
      description: >
        Если панель уже создана в списке (например заранее настроена под
        клиента) — укажите её ID, чтобы установить именно на неё. Пусто —
        будет создана новая панель по panel_name.
      required: false
      selector: { text: {} }
    panel_name:
      name: Имя новой панели
      description: Используется только если panel_id не указан.
      required: false
      example: Панель кухни
      selector: { text: {} }
    ha_host:
      name: Адрес HA для панели (опционально)
      description: >
        На случай нескольких сетевых интерфейсов сервера — обычно
        определяется само.
      required: false
      selector: { text: {} }
    ha_port:
      name: Порт HA (опционально)
      required: false
      selector: { number: { min: 1, max: 65535, mode: box } }
